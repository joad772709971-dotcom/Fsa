<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remix مشروع محل مصعب رقم 2 - نظام إدارة الحسابات والمبيعات</title>
    <meta name="description" content="نظام الرقم الأول المحاسبي والإداري المتكامل لإدارة المبيعات والصيانة وشبكات الرصيد وتصفية الأرباح اليومية وكشوفات الحساب" />
    <meta property="og:title" content="Remix مشروع محل مصعب رقم 2 - نظام إدارة الحسابات والمبيعات" />
    <meta property="og:description" content="نظام الرقم الأول المحاسبي والإداري المتكامل لإدارة المبيعات والصيانة وشبكات الرصيد وتصفية الأرباح اليومية وكشوفات الحساب" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-amber-500 selection:text-black min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #f8fafc; font-family: 'Cairo', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 52px; height: 52px; border: 4px solid #1e293b; border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h1 style="margin: 0; font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px;">الرقم الأول</h1>
        <p style="margin: 6px 0 0 0; color: #f59e0b; font-size: 13px; font-weight: 700;">محل مصعب الصوفي للجوالات</p>
        <p style="margin: 12px 0 0 0; color: #64748b; font-size: 12px;">جاري تشغيل النظام وقاعدة البيانات...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mosaab_font_scale_level') || localStorage.getItem('mosaab_chrome_zoom_level');
          if (saved) {
            var val = Number(saved);
            if (val >= 40 && val <= 250) {
              var ratio = val / 100;
              document.documentElement.style.removeProperty('zoom');
              document.documentElement.style.setProperty('--app-font-scale', ratio.toString());
              document.documentElement.style.fontSize = (16 * ratio) + 'px';
              var styleTag = document.getElementById('app-font-scaling-dynamic');
              if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'app-font-scaling-dynamic';
                document.head.appendChild(styleTag);
              }
              styleTag.textContent = ':root{--app-font-scale:' + ratio + '!important;}html{font-size:' + (16 * ratio) + 'px!important;width:100%!important;max-width:100vw!important;}html,body{width:100%!important;max-width:100vw!important;}.text-xs{font-size:' + (12 * ratio) + 'px!important;}.text-sm{font-size:' + (14 * ratio) + 'px!important;}.text-base{font-size:' + (16 * ratio) + 'px!important;}.text-lg{font-size:' + (18 * ratio) + 'px!important;}.text-xl{font-size:' + (20 * ratio) + 'px!important;}.text-2xl{font-size:' + (24 * ratio) + 'px!important;}.text-3xl{font-size:' + (30 * ratio) + 'px!important;}';
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
